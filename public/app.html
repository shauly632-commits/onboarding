<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>קליטת עובדים</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 100px}
.brand{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.brand b{display:block;line-height:1.2}.brand span{font-size:.8rem;color:var(--mut)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:24px;padding:24px;margin-bottom:16px;box-shadow:0 14px 34px rgba(79,70,229,.3)}
.hero h1{font-size:1.5rem;margin-bottom:4px}
.hero p{margin:0;opacity:.93}
.hero .bar{background:rgba(255,255,255,.3);margin-top:16px}
.hero .bar>i{background:#fff}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .meta span{background:rgba(255,255,255,.18);padding:.2em .8em;border-radius:99px;font-size:.82rem}
.item{display:flex;gap:14px;align-items:center;margin-bottom:12px;cursor:pointer;padding:16px;transition:.15s}
.item:active{transform:scale(.985)}
.item:hover{border-color:#c7caf7}
.item .ico{flex:none;width:48px;height:48px;border-radius:15px;background:var(--priBg);display:flex;align-items:center;justify-content:center;font-size:1.35rem}
.item.done .ico{background:var(--okbg)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;line-height:1.3}
.item .t span{color:var(--mut);font-size:.86rem;display:block;margin-top:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h2{margin:0;font-size:1.15rem}
.savebar{position:fixed;inset-inline:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
.savebar .in{display:flex;gap:10px;width:100%;max-width:640px}
.savebar .btn{flex:1}
.saved{font-size:.85rem;color:var(--mut);min-height:1.3em;margin-top:8px}
.center{text-align:center;padding:40px 14px}
.big{font-size:3.2rem}
.bigic{width:68px;height:68px;border-radius:22px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--okbg);color:var(--ok)}
.bigic .i{width:34px;height:34px}.bigic.pri{background:var(--priBg);color:var(--pri)}.bigic.err{background:var(--errbg);color:var(--err)}
.hero .meta span{display:inline-flex;align-items:center;gap:6px}
.prep{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.prep div{display:flex;align-items:center;gap:8px;background:#f6f7fc;border-radius:12px;padding:10px;font-size:.9rem;font-weight:600}
.prep .i{color:var(--pri)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps .n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--priBg);color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.steps b{display:block;line-height:1.3;font-size:.95rem}
.stepper{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.stepper .row1{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:8px}
.segs{display:flex;gap:5px}
.seg{flex:1;height:8px;border:0;border-radius:99px;background:#e3e6f2;cursor:pointer;padding:0;transition:background .2s}
.seg.done{background:var(--ok)}
.seg.cur{background:linear-gradient(90deg,var(--pri),var(--pri2));box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.ftitle{font-size:1.25rem;margin:0 0 6px}
.item .ico .i{width:22px;height:22px;color:var(--ok)}
.btn.nb{flex:0 0 52px!important;padding:0}
.saved{display:flex;align-items:center;gap:4px}
.lockline{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;margin:8px 0 0;color:var(--mut)}
.warnp{background:var(--errbg)!important;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.checklist .ck .i{width:14px;height:14px}
.checklist{list-style:none;margin:0 0 14px;padding:0}
.checklist li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.checklist li:last-child{border:0}
.checklist .ck{flex:none;width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800}
.checklist .y{background:var(--okbg);color:var(--ok)}.checklist .n{background:#eef0f6;color:var(--mut)}
.tipwrap{position:relative;display:block}
.tipwrap .btn{width:100%}
.btn:disabled{background:#c9ccd9;box-shadow:none;cursor:not-allowed;color:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loadbox"><svg class="i spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>טוען את טפסי הקליטה...</div></div>
<script src="/forms.js"></script>
<script>
const { $e, icon, busy, render } = Forms;
const token = location.pathname.split('/')[2];
const API = '/api/e/' + token;
let state = null, installEvt = null, ctl = null, current = '';
const app = document.getElementById('app');

document.head.append($e('link', { rel: 'manifest', href: API + '/manifest.json' }));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
// כפתור ההתקנה מופיע רק במסך הסקירה; לא מוציאים את המשתמש ממסך אחר
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (current === 'home') home(); });

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'שגיאה'); e.status = r.status; e.errors = j.errors; throw e; }
  return j;
}
function toast(msg, err) { const t = $e('div', { class: 'toast' + (err ? ' err' : ''), icon: err ? 'alert' : 'checkCircle', text: msg }); document.body.append(t); setTimeout(() => t.remove(), 3200); }
const fmtDate = (s) => s ? new Date(s).toLocaleDateString('he-IL') : '';
const firstName = () => state.employee.full_name.split(' ')[0];
const isDone = (a) => a.status === 'submitted';
const minutes = (t) => Math.max(1, Math.round(t.fields.filter((f) => !['heading', 'paragraph', 'document'].includes(f.type)).length / 4));
// מסך חדש: מנקה, מוסיף אנימציית כניסה וגולל למעלה
function screen(name, ...nodes) { current = name; app.textContent = ''; const w = $e('div', { class: 'fade' }, nodes); app.append(w); scrollTo(0, 0); return w; }

async function load() {
  try { state = await api(''); } catch (e) {
    screen('error', $e('div', { class: 'center card' }, $e('div', { class: 'bigic err' }, icon('link')), $e('h2', { text: 'הקישור אינו תקף' }), $e('p', { class: 'muted', text: 'פנו אל משאבי אנוש לקבלת קישור חדש.' })));
    return false;
  }
  return true;
}
const brand = () => $e('div', { class: 'brand' }, $e('div', { class: 'logo', text: 'אודי' }), $e('div', {}, $e('b', { text: state.company || 'קליטת עובדים' }), $e('span', { text: 'קליטת עובד/ת חדש/ה' })));
const started = () => { try { return localStorage.getItem('started_' + token) === '1'; } catch { return false; } };
const markStarted = () => { try { localStorage.setItem('started_' + token, '1'); } catch {} };

// ---------- מסך פתיחה: הסבר על התהליך והשלבים ----------
function welcome() {
  ctl = null;
  const as = state.assignments, total = as.reduce((n, a) => n + minutes(a.template), 0);
  const startBtn = $e('button', { class: 'btn', style: 'width:100%', onclick: () => { markStarted(); openForm(as[0].template.id); } }, 'בואו נתחיל', icon('next'));
  screen('welcome', brand(),
    $e('div', { class: 'hero' }, $e('h1', { text: 'שלום ' + firstName() + ', ברוכים הבאים!' }),
      $e('p', { text: 'לפני תחילת העבודה צריך להשלים כמה טפסים ומסמכים. התהליך מתבצע כולו מהטלפון, ואפשר לעצור ולהמשיך בכל זמן: כל מה שממלאים נשמר אוטומטית.' }),
      $e('div', { class: 'meta' }, $e('span', { icon: 'file', text: as.length + ' שלבים' }), $e('span', { icon: 'clock', text: 'כ-' + total + ' דקות' }), $e('span', { icon: 'lock', text: 'מאובטח' }))),
    $e('div', { class: 'card' }, $e('h3', { style: 'margin:0 0 4px', text: 'מה צריך להכין' }),
      $e('div', { class: 'prep' }, [['idcard', 'תעודת זהות + ספח'], ['file', 'פרטי חשבון בנק'], ['camera', 'טלפון לצילום מסמכים'], ['pen', 'חתימה באצבע על המסך']].map(([ic, t]) => $e('div', { icon: ic, text: t })))),
    $e('div', { class: 'card', style: 'margin-top:14px' }, $e('h3', { style: 'margin:0 0 8px', text: 'שלבי התהליך' }),
      $e('ol', { class: 'steps' }, as.map((a, i) => $e('li', {}, $e('span', { class: 'n', text: i + 1 }), $e('div', {}, $e('b', { text: a.template.title }), $e('small', { class: 'muted', text: 'כ-' + minutes(a.template) + ' דק׳' })))),
        $e('li', {}, $e('span', { class: 'n' }, icon('send')), $e('div', {}, $e('b', { text: 'בדיקה ושליחה למשאבי אנוש' }), $e('small', { class: 'muted', text: 'אחרי שכל השלבים הושלמו' }))))),
    $e('div', { class: 'savebar' }, $e('div', { class: 'in' }, startBtn)));
}

// ---------- סקירה: כל השלבים, רשימת ביצוע ושליחה סופית ----------
function home() {
  ctl = null; if (location.hash) history.replaceState(null, '', location.pathname);
  const as = state.assignments, done = as.filter(isDone).length;
  const meta = [state.employee.job_title, state.employee.department].filter(Boolean);
  const next = as.find((a) => !isDone(a));
  const w = screen('home', brand(), $e('div', { class: 'hero' },
    $e('h1', { text: 'שלום ' + firstName() }),
    $e('p', { text: state.approved ? 'התיק אושר ונקלטת כעובד/ת. ברוכים הבאים לצוות!' : state.submitted_at ? 'התיק נשלח למשאבי אנוש לבדיקה סופית. תודה רבה!' : done === as.length && as.length ? 'כל השלבים הושלמו! נשאר רק לשלוח את התיק למשאבי אנוש.' : 'הושלמו ' + done + ' מתוך ' + as.length + ' שלבים. אפשר לעצור ולהמשיך בכל זמן: ההתקדמות נשמרת.' }),
    meta.length ? $e('div', { class: 'meta' }, meta.map((m) => $e('span', { text: m }))) : null,
    $e('div', { class: 'bar' }, $e('i', { style: 'width:' + (as.length ? (100 * done / as.length) : 0) + '%' }))));
  if (!as.length) w.append($e('div', { class: 'card center muted', text: 'עדיין לא הוקצו טפסים.' }));
  if (next && !state.submitted_at) w.append($e('button', { class: 'btn', style: 'width:100%;margin-bottom:14px', onclick: () => openForm(next.template.id) }, done ? 'המשך לשלב הבא' : 'התחלת המילוי', icon('next')));
  as.forEach((a, i) => {
    const ok = isDone(a);
    const pend = Object.values(a.exemptions || {}).some((x) => x.status === 'rejected');
    w.append($e('div', { class: 'card item' + (ok ? ' done' : ''), role: 'button', tabindex: 0, onclick: () => openForm(a.template.id), onkeydown: (e) => e.key === 'Enter' && openForm(a.template.id) },
      $e('div', { class: 'ico' }, ok ? icon('check') : String(i + 1)),
      $e('div', { class: 't' }, $e('b', { text: a.template.title }), $e('span', { text: a.template.description || '' })),
      $e('span', { class: 'chip' + (ok ? ' ok' : pend ? ' err' : ''), text: ok ? 'הושלם' : pend ? 'נדרש תיקון' : (Object.keys(a.data).length || a.files.length ? 'בתהליך' : 'ממתין') })));
  });
  if (as.length) w.append(finalCard(as));
  if (installEvt) w.append($e('button', { class: 'btn sec', style: 'width:100%;margin-top:12px', icon: 'install', text: 'התקנה כאפליקציה בטלפון', onclick: () => { installEvt.prompt(); installEvt = null; home(); } }));
  else if (/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone)
    w.append($e('p', { class: 'muted', style: 'text-align:center;margin-top:14px;font-size:.9rem', text: 'להתקנה כאפליקציה: לחצו על כפתור השיתוף בדפדפן ובחרו "הוסף למסך הבית".' }));
}

// רשימת ביצוע + כפתור שליחה סופית שנעול עד שכל השלבים הושלמו
function finalCard(as) {
  if (state.submitted_at) return $e('div', { class: 'card center', style: 'margin-top:6px' }, $e('div', { class: 'bigic' + (state.approved ? '' : ' pri') }, icon(state.approved ? 'sparkles' : 'send')),
    $e('h2', { text: state.approved ? 'נקלטת בהצלחה!' : 'הפרטים נשלחו' }), $e('p', { class: 'muted', text: state.approved ? 'משאבי אנוש אישרו את התיק שלך.' : 'הפרטים שלך נשלחו למשאבי אנוש לבדיקה סופית. נעדכן אותך בהמשך.' }));
  const missing = as.filter((a) => !isDone(a));
  const rejected = as.some((a) => Object.values(a.exemptions || {}).some((x) => x.status === 'rejected'));
  const ready = !missing.length && !rejected;
  const tip = ready ? '' : rejected ? 'בקשת פטור נדחתה. יש להעלות את המסמך החסר' : 'יש להשלים את כל השלבים לפני השליחה (' + missing.length + ' חסרים)';
  const btn = $e('button', { class: 'btn', icon: 'send', text: 'שליחה למשאבי אנוש', disabled: !ready, title: tip, onclick: () => busy(btn, async () => {
    try { await api('/submit', { method: 'POST' }); await load(); thanks(); } catch (e) { toast(e.message, true); }
  }) });
  return $e('div', { class: 'card', style: 'margin-top:6px' }, $e('h3', { style: 'margin:0 0 10px', text: 'רשימת ביצוע' }),
    $e('ul', { class: 'checklist' }, as.map((a) => { const ok = isDone(a); return $e('li', {}, $e('span', { class: 'ck ' + (ok ? 'y' : 'n') }, ok ? icon('check') : null), $e('span', { style: ok ? '' : 'color:var(--mut)', text: a.template.title })); })),
    $e('span', { class: 'tipwrap', title: tip }, btn),
    ready ? null : $e('p', { class: 'lockline', icon: 'lock', text: tip }));
}
function thanks() {
  screen('thanks', brand(), $e('div', { class: 'card center' }, $e('div', { class: 'bigic ok' }, icon('checkCircle')), $e('h2', { text: 'תודה, ' + firstName() + '!' }),
    $e('p', { text: 'הפרטים שלך נשלחו למשאבי אנוש לבדיקה סופית.' }), $e('p', { class: 'muted', text: 'אפשר לסגור את החלון. אם יידרש תיקון, נחזור אליך.' }),
    $e('button', { class: 'btn ghost', icon: 'back', text: 'חזרה לסקירה', onclick: home })));
}

// ---------- אשף: שלב אחד בכל פעם ----------
function stepper(idx) {
  const as = state.assignments;
  return $e('div', { class: 'stepper' },
    $e('div', { class: 'row1' }, $e('b', { text: 'שלב ' + (idx + 1) + ' מתוך ' + as.length }), $e('span', { class: 'muted', text: as.filter(isDone).length + ' הושלמו' })),
    $e('div', { class: 'segs' }, as.map((a, i) => $e('button', { type: 'button', class: 'seg' + (isDone(a) ? ' done' : '') + (i === idx ? ' cur' : ''), title: (i + 1) + '. ' + a.template.title, 'aria-label': 'מעבר לשלב ' + (i + 1),
      onclick: async () => { if (i === idx) return; if (ctl) await ctl.flush(); openForm(a.template.id); } }))));
}
async function goTo(tplId) { if (ctl) await ctl.flush(); ctl = null; if (tplId) openForm(tplId); else { await load(); home(); } }

function openForm(tplId) {
  const as = state.assignments, idx = as.findIndex((x) => x.template.id === tplId);
  const a = as[idx], t = a.template, prev = as[idx - 1], next = as[idx + 1];
  history.replaceState(null, '', location.pathname + '#f' + tplId); ctl = null;
  const top = $e('div', { class: 'top' }, $e('button', { class: 'btn ghost sm', icon: 'back', text: 'כל השלבים', onclick: () => goTo(null) }));
  const head = $e('div', {}, stepper(idx), $e('h2', { class: 'ftitle', text: t.title }), t.description ? $e('p', { class: 'muted', style: 'margin:-4px 0 12px', text: t.description }) : null);
  const nav = (main) => $e('div', { class: 'savebar' }, $e('div', { class: 'in' },
    prev ? $e('button', { class: 'btn ghost nb', title: 'לשלב הקודם', 'aria-label': 'לשלב הקודם', onclick: () => goTo(prev.template.id) }, icon('back')) : null, main));
  if (isDone(a)) {
    screen('form', top, head, $e('div', { class: 'card center' }, $e('div', { class: 'bigic ok' }, icon('checkCircle')), $e('h2', { text: 'השלב הושלם' }),
      $e('p', { class: 'muted', text: 'נשלח בתאריך ' + fmtDate(a.submitted_at) + '. לאחר השליחה לא ניתן לערוך. לשינוי פנו אל משאבי אנוש.' })),
      nav($e('button', { class: 'btn', onclick: () => goTo(next ? next.template.id : null) }, next ? 'לשלב הבא' : 'לסקירה ושליחה', icon('next'))));
    return;
  }
  const card = $e('div', { class: 'card' });
  if (Object.values(a.exemptions || {}).some((x) => x.status === 'rejected'))
    card.append($e('div', { class: 'para warnp', icon: 'alert', text: 'בקשת פטור ממסמך נדחתה. יש להעלות את המסמך החסר.' }));
  if (t.attachment) card.append($e('p', {}, icon('clip'), ' ', $e('a', { href: API + '/templates/' + t.id + '/attachment', target: '_blank', text: 'להורדת הטופס: ' + t.attachment.name })));
  const body = $e('div'); card.append(body);
  const saved = $e('div', { class: 'saved' });
  ctl = render(body, t, {
    data: a.data, files: a.files, exemptions: a.exemptions, prefill: state.employee,
    onChange: async (vals) => { saved.replaceChildren(icon('loader'), ' שומר...'); try { await api('/forms/' + tplId, { method: 'PUT', body: { data: vals } }); a.data = { ...vals }; saved.replaceChildren(icon('check'), ' נשמר אוטומטית'); } catch (e) { saved.textContent = e.status === 409 ? 'הטופס כבר נשלח' : 'השמירה נכשלה, בדקו חיבור'; } },
    // מעדכנים גם את המצב המקומי, כדי שמעבר בין שלבים יציג את הקבצים ובקשות הפטור העדכניים
    upload: async (field, payload) => {
      const r = await api('/forms/' + tplId + '/files', { method: 'POST', body: { field, ...payload } });
      a.files = a.files.filter((x) => x.field_key !== field).concat({ ...r, filename: payload.filename }); delete a.exemptions[field];
      return r;
    },
    exempt: async (field, p) => {
      const r = await api('/forms/' + tplId + '/exempt', { method: 'POST', body: { field, ...p } });
      if (r.exemption) a.exemptions[field] = r.exemption; else delete a.exemptions[field];
      return r;
    },
    fileUrl: (id) => API + '/files/' + id,
    docUrl: (f) => API + '/docs/' + f,
  });
  const submit = $e('button', { class: 'btn', onclick: async () => {
    const errs = ctl.validate();
    if (Object.keys(errs).length) { ctl.showErrors(errs); return toast('יש למלא את שדות החובה המסומנים', true); }
    await busy(submit, async () => {
      try {
        await api('/forms/' + tplId, { method: 'PUT', body: { data: ctl.collect(), submit: true } });
        toast('השלב נשמר ונשלח');
        await load(); ctl = null;
        // ממשיכים אוטומטית לשלב הבא שעוד לא הושלם, ואם אין כזה לסקירה ושליחה
        const nx = state.assignments.slice(idx + 1).find((x) => !isDone(x)) || state.assignments.find((x) => !isDone(x));
        nx ? openForm(nx.template.id) : home();
      } catch (e) { if (e.errors) ctl.showErrors(e.errors); toast(e.message, true); }
    });
  } }, next ? 'שמירה והמשך' : 'שמירה וסיום', icon(next ? 'next' : 'check'));
  screen('form', top, head, card, saved, nav(submit));
}

(async () => {
  if (!(await load())) return;
  const m = /^#f(\d+)$/.exec(location.hash);
  const as = state.assignments;
  if (m && as.some((a) => a.template.id === +m[1])) openForm(+m[1]);
  else if (as.length && !state.submitted_at && !as.some((a) => isDone(a) || Object.keys(a.data).length || a.files.length) && !started()) welcome();
  else home();
})();
</script>
</body>
</html>
