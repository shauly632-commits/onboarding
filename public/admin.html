<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>דשבורד קליטת עובדים</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
.shell{max-width:1240px;margin:0 auto;padding:0 18px 70px}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .in{max-width:1240px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(min-width:1200px){.org .chip{display:none}}
.org{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 18px rgba(79,70,229,.3)}
.org b{font-size:1.15rem}
.org small{display:block;color:var(--mut);font-size:.82rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;background:#f6f7fc;border:1px solid var(--line);border-radius:18px;padding:5px}
.pill{border:0;background:none;display:flex;align-items:center;gap:6px;padding:.5em .8em;font-size:.93rem;border-radius:14px;cursor:pointer;font-weight:700;color:var(--mut);white-space:nowrap}
.pill:hover{color:var(--ink)}
.pill.on{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(27,33,64,.08)}
.badge{background:#f59e0b;color:#fff;border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;padding:0 6px}
.sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:22px 0}
.stat{position:relative;padding:20px}
.stat .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:6px}
.stat .n{font-size:2.4rem;font-weight:800;line-height:1}
.stat h4{margin:0 0 6px;font-size:1rem}
.stat small{color:var(--mut)}
.tblcard{padding:0;overflow:hidden}
.tblhead{padding:22px 22px 6px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:14px 22px 18px}
@media(max-width:700px){.filters{grid-template-columns:1fr}}
.tblwrap{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 16px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbff;font-size:.8rem;color:var(--mut);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#fafbff}
.avatar{width:44px;height:44px;border-radius:99px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.who{display:flex;gap:12px;align-items:center}
.who b{display:block}
.quick{display:flex;gap:6px}
.quick .btn{min-height:36px;width:36px;padding:0;border-radius:11px;box-shadow:none}
.login{max-width:400px;margin:12vh auto}
.modal{position:fixed;inset:0;background:rgba(20,26,56,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal>.card{width:100%;max-width:580px}
.checks label{display:flex;gap:8px;align-items:center;padding:6px 0}
.checks input{width:18px;height:18px;accent-color:var(--pri)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.tcard{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s}
.tcard:hover{border-color:#c7caf7;transform:translateY(-2px)}
.tcard .h{display:flex;justify-content:space-between;align-items:flex-start}
.tcard .ic{width:50px;height:50px;border-radius:15px;background:var(--priBg);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--pri)}
.tcard h3{margin:0;font-size:1.1rem}
.tcard p{margin:0;color:var(--mut);font-size:.9rem}
.tcard .fl{font-size:.8rem;font-weight:700;color:var(--mut);text-align:end;border-top:1px solid var(--line);padding-top:10px}
.tcard .chips{display:flex;gap:6px;flex-wrap:wrap}
.tcard .f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;color:var(--mut);font-size:.85rem}
.fb{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fcfcff}
.fb .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb input,.fb select,.fb textarea{min-height:40px;padding:.4em .7em;border-radius:10px}
.sigimg{max-width:240px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ans{display:grid;grid-template-columns:220px 1fr;gap:6px 14px;margin:0}
.ans dt{color:var(--mut)}.ans dd{margin:0;word-break:break-word}
@media(max-width:600px){.ans{grid-template-columns:1fr}.ans dt{margin-top:8px}}
.linkbox{direction:ltr;text-align:left;background:#f4f6fb;border-radius:10px;padding:10px 12px;font-size:.85rem;word-break:break-all}
.phone{width:400px;max-width:100%;height:790px;border:12px solid #1b2140;border-radius:44px;background:#fff;overflow:hidden;margin:auto;box-shadow:0 20px 50px rgba(27,33,64,.3)}
.desk{width:100%;height:760px;border:1px solid var(--line);border-radius:16px;background:#fff}
iframe{border:0;width:100%;height:100%;display:block}
.exrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border:0}
.vsw{display:inline-flex;background:#f6f7fc;border:1px solid var(--line);border-radius:12px;padding:3px}
.vsw button{border:0;background:none;padding:.35em .8em;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer}
.vsw button.on{background:#fff;color:var(--pri);box-shadow:0 2px 6px rgba(27,33,64,.08)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;padding:16px 22px 22px;overflow-x:auto;border-top:1px solid var(--line)}
.kcol{background:#f6f7fc;border-radius:16px;padding:10px;min-height:160px}
.kcol h4{margin:4px 6px 10px;display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
.kc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.kc:hover{border-color:#c7caf7;transform:translateY(-1px)}
.kc .who{gap:10px}.kc .avatar{width:36px;height:36px;font-size:.85rem}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mut)}
.live i{width:8px;height:8px;border-radius:99px;background:#9aa1b9}
.live.on i{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.stat .ic .i{width:24px;height:24px}
.tcard .ic .i{width:26px;height:26px}
.quick .btn .i{width:18px;height:18px}
.vsw button{display:inline-flex;align-items:center;gap:6px}
.btn.ok{background:var(--okbg);color:var(--ok);box-shadow:none;border:1px solid #bfe7d4}
.okt{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:600}
.fnode{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff}
.fnode.ok{border-color:#bfe7d4;background:#f6fcf9}
.fnode .th{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:var(--priBg);color:var(--pri)}
.fnode .th img{width:100%;height:100%;object-fit:cover}
.fnode .fn{flex:1;min-width:120px;word-break:break-all}
.ans dd .chip .i{width:14px;height:14px}
/* דשבורד בנייד: כותרת קומפקטית וניווט בגלילה אופקית */
@media(max-width:760px){
  header.top .in{padding:8px 12px;gap:8px}
  .org small,.org .chip,header.top .sp{display:none}
  .org{flex:1;min-width:0;gap:8px}
  .org>div:last-child{min-width:0}
  .org b{font-size:.95rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{font-size:0;gap:0}
  .logo{width:40px;height:40px;border-radius:13px;font-size:.85rem}
  .nav{order:5;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px}
  .nav::-webkit-scrollbar{display:none}
  .pill{padding:.45em .7em;font-size:.86rem}
  .btn.hdr{min-height:40px;width:40px;padding:0;border-radius:12px}
  .btn.hdr .bl{display:none}
  .stats{grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .stat{padding:14px}.stat .n{font-size:1.8rem}.stat .ic{width:38px;height:38px}
  .shell{padding:0 12px 60px}
  .tblhead,.filters{padding-inline:14px}
  .kanban{padding:12px 14px;grid-template-columns:repeat(4,minmax(78vw,1fr));scroll-snap-type:x mandatory}
  .kcol{scroll-snap-align:start}
}
.exwarn{display:flex;gap:6px;align-items:center;color:var(--warn);font-weight:600;font-size:.9rem;margin-top:4px}
.hirebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:16px;margin-bottom:16px}
</style>
</head>
<body>
<div id="root"></div>
<script src="/forms.js"></script>
<script>
const { $e, icon, busy } = Forms;
const root = document.getElementById('root');
let me = null, view = 'employees', list = [], cfg = { capacity: 180 }, pendingEx = 0, tplCount = 0, simTarget = '', simDevice = 'phone';
let detailId = null, boardMode = 'table', quietRender = false, renderSeq = 0;
const flt = { q: '', s: '', d: '' };
try { boardMode = localStorage.getItem('boardMode') || 'table'; } catch {}

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/login') { me = null; showLogin(); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || 'שגיאה');
  return j;
}
function toast(msg, err) { const t = $e('div', { class: 'toast' + (err ? ' err' : ''), icon: err ? 'alert' : 'checkCircle', text: msg.replace(/\s*✓$/, '') }); document.body.append(t); setTimeout(() => t.remove(), 3400); }
const guard = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message, true); } };
const fmt = (s) => s ? new Date(s).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const ago = (s) => { if (!s) return '—'; const m = Math.round((Date.now() - new Date(s)) / 60000); if (m < 1) return 'ממש עכשיו'; if (m < 60) return 'לפני ' + m + ' דק׳'; if (m < 1440) return 'לפני ' + Math.round(m / 60) + ' שעות'; return fmt(s); };
const empUrl = (tok) => location.origin + '/e/' + tok;
const initials = (n) => (n || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('');
function modal(content, wide) { const m = $e('div', { class: 'modal', onclick: (e) => e.target === m && m.remove() }, $e('div', { class: 'card', style: wide ? 'max-width:780px' : '' }, content)); document.body.append(m); return m; }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('הקישור הועתק ✓'); } catch { prompt('העתיקו את הקישור:', text); } }
const waLink = (e) => 'https://wa.me/' + (e.phone || '').replace(/\D/g, '').replace(/^0/, '972') + '?text=' + encodeURIComponent('שלום ' + e.full_name.split(' ')[0] + ', ברוכים הבאים! אנא מלאו את טפסי הקליטה בקישור:\n' + empUrl(e.token));
const STATUS = { new: ['טרם התחיל', 'gray'], progress: ['בתהליך מילוי', ''], review: ['ממתין לבדיקה', 'pri'], approved: ['נקלט ואושר', 'ok'] };

// ---------- עדכונים בזמן אמת ----------
let es = null, liveOn = false, livePending = false;
const liveDot = () => $e('span', { class: 'live' + (liveOn ? ' on' : ''), title: liveOn ? 'הלוח מתעדכן בזמן אמת' : 'מתחבר מחדש...' }, $e('i'), liveOn ? 'עדכון חי' : 'לא מחובר');
function connectLive() {
  if (es) es.close();
  es = new EventSource('/api/events');
  es.onopen = () => { liveOn = true; document.querySelectorAll('.live').forEach((n) => n.replaceWith(liveDot())); };
  es.onerror = () => { liveOn = false; document.querySelectorAll('.live').forEach((n) => n.replaceWith(liveDot())); if (!me) es.close(); };
  es.onmessage = () => liveRefresh();
}
// לא מרנדרים מחדש באמצע הקלדה או כשחלון פתוח; מנסים שוב כשהמשתמש מסיים
function liveRefresh() {
  if (!me) return;
  const busy = document.querySelector('.modal') || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (busy) { if (!livePending) { livePending = true; setTimeout(() => { livePending = false; liveRefresh(); }, 1500); } return; }
  const y = scrollY;
  const done = view === 'detail' && detailId ? employeeDetail(detailId, true) : ['employees', 'exemptions'].includes(view) ? go(true) : refreshMeta().then(() => {});
  Promise.resolve(done).then(() => scrollTo(0, y)).catch(() => {});
}

// ---------- login ----------
function showLogin() {
  root.textContent = '';
  const u = $e('input', { type: 'text', autocomplete: 'username', dir: 'ltr' }), p = $e('input', { type: 'password', autocomplete: 'current-password', dir: 'ltr' });
  const btn = $e('button', { class: 'btn', style: 'width:100%;margin-top:20px', text: 'כניסה' });
  const go = guard(() => busy(btn, async () => { me = await api('/login', 'POST', { username: u.value, password: p.value }); await boot(); }));
  btn.addEventListener('click', go);
  p.addEventListener('keydown', (e) => e.key === 'Enter' && go());
  root.append($e('div', { class: 'login card' }, $e('div', { class: 'logo', style: 'margin-bottom:12px', text: 'אודי' }), $e('h1', { text: 'כניסה לדשבורד הקליטה' }),
    $e('label', { class: 'f', text: 'שם משתמש' }), u, $e('label', { class: 'f', text: 'סיסמה' }), p,
    btn));
}

// ---------- shell ----------
function loading() {
  const sh = root.querySelector('.shell');
  if (sh) { sh.textContent = ''; sh.append($e('div', { class: 'loadbox' }, icon('loader'), 'טוען...')); }
}
function shell(content) {
  root.textContent = '';
  const tab = (k, ic, label, extra) => $e('button', { class: 'pill' + (view === k ? ' on' : ''), icon: ic, onclick: () => { view = k; go(); } }, $e('span', { class: 'pl', text: label }), extra);
  root.append($e('header', { class: 'top noprint' }, $e('div', { class: 'in' },
    $e('div', { class: 'org' }, $e('div', { class: 'logo', text: 'אודי' }), $e('div', {}, $e('b', {}, me.company || 'קליטת עובדים', ' ', $e('span', { class: 'chip pri', text: 'דשבורד מנהל (' + (me.name || '') + ')' })), $e('small', { text: me.company_line || '' }))),
    $e('div', { class: 'nav' },
      tab('employees', 'users', 'לוח עובדים (' + list.length + '/' + cfg.capacity + ')'),
      tab('exemptions', 'shield', 'אישורי פטור ממסמך', pendingEx ? $e('span', { class: 'badge', text: pendingEx }) : null),
      tab('templates', 'file', 'סל טפסים (' + tplCount + ')'),
      tab('sim', 'phone', 'סימולטור נייד'),
      tab('settings', 'settings', 'הגדרות')),
    $e('span', { class: 'sp' }),
    $e('button', { class: 'btn sec hdr', icon: 'link', title: 'העתקת קישור ההרשמה למועמדים', onclick: () => copy(location.origin + '/apply') }, $e('span', { class: 'bl', text: 'קישור למועמדים' })),
    $e('button', { class: 'btn hdr', icon: 'userPlus', onclick: newEmployee }, $e('span', { class: 'bl', text: 'קליטת עובד חדש' })),
    liveDot(),
    $e('button', { class: 'btn ghost icon', title: 'יציאה', icon: 'logout', onclick: async () => { await api('/logout', 'POST'); me = null; es?.close(); showLogin(); } }))),
  $e('div', { class: 'shell' + (quietRender ? '' : ' fade') }, content));
  quietRender = false;
}
async function refreshMeta() {
  const [l, ex, t] = await Promise.all([api('/employees'), api('/exemptions'), api('/templates')]);
  list = l; pendingEx = ex.filter((x) => x.status === 'pending').length; tplCount = t.length;
  return { ex, t };
}
function go(quiet) { if (view !== 'detail') detailId = null; quietRender = !!quiet; renderSeq++; if (!quiet) loading(); ({ employees: employeesView, exemptions: exemptionsView, templates: templatesView, sim: simView, settings: settingsView, detail: () => employeeDetail(detailId) })[view](); }
async function boot() { cfg.capacity = me.capacity || 180; view = 'employees'; await refreshMeta(); go(); connectLive(); }

// ---------- employees ----------
async function employeesView() {
  const seq = renderSeq;
  await refreshMeta();
  if (seq !== renderSeq || view !== 'employees') return; // המשתמש עבר למסך אחר בזמן הטעינה
  const cap = cfg.capacity;
  const n = (s) => list.filter((e) => e.status === s).length;
  const stat = (icBg, ic, title, num, numColor, sub, bar, barOk) => $e('div', { class: 'card stat' }, $e('div', { class: 'ic', style: 'background:' + icBg + ';color:' + numColor }, icon(ic)),
    $e('h4', { text: title }), $e('div', { class: 'n', style: 'color:' + numColor, text: num }), $e('small', { text: sub }), bar != null ? $e('div', { class: 'bar' + (barOk ? ' ok' : ''), style: 'margin-top:12px' }, $e('i', { style: 'width:' + bar + '%' })) : null);
  const q = $e('input', { type: 'text', value: flt.q, placeholder: 'חיפוש לפי שם, ת.ז., טלפון או דוא"ל...' });
  const fs = $e('select', {}, $e('option', { value: '', text: 'כל הסטטוסים' }), Object.entries(STATUS).map(([k, v]) => $e('option', { value: k, text: v[0] })));
  const depts = [...new Set(list.map((e) => e.department).filter(Boolean))];
  const fd = $e('select', {}, $e('option', { value: '', text: 'כל המחלקות' }), depts.map((d) => $e('option', { value: d, text: d })));
  fs.value = flt.s; fd.value = depts.includes(flt.d) ? flt.d : '';
  const tb = $e('tbody');
  const board = $e('div');
  const filtered = () => { const s = q.value.trim().toLowerCase(); return list.filter((e) => (!s || [e.full_name, e.phone, e.email, e.id_number, e.job_title].join(' ').toLowerCase().includes(s)) && (!fs.value || e.status === fs.value) && (!fd.value || e.department === fd.value)); };
  const progress = (e) => { const pct = e.total ? Math.round(100 * e.done / e.total) : 0; return [$e('div', { class: 'row', style: 'justify-content:space-between;gap:4px;font-size:.8rem' }, $e('span', { class: 'muted', text: e.done + '/' + e.total + ' טפסים' }), $e('b', { text: pct + '%' })), $e('div', { class: 'bar' + (pct === 100 ? ' ok' : ''), style: 'margin-top:4px' }, $e('i', { style: 'width:' + pct + '%' }))]; };
  const kanban = () => $e('div', { class: 'kanban' }, Object.entries(STATUS).map(([k, [label, cls]]) => {
    const items = filtered().filter((e) => e.status === k);
    return $e('div', { class: 'kcol' }, $e('h4', {}, $e('span', { text: label }), $e('span', { class: 'chip ' + cls, text: items.length })),
      items.map((e) => $e('div', { class: 'kc', onclick: () => employeeDetail(e.id) },
        $e('div', { class: 'who' }, $e('div', { class: 'avatar', text: initials(e.full_name) }), $e('div', { style: 'min-width:0' }, $e('b', { text: e.full_name }), $e('small', { class: 'muted', text: [e.job_title, e.department].filter(Boolean).join(' · ') || e.phone || '' }))),
        $e('div', { style: 'margin-top:10px' }, progress(e)),
        $e('div', { class: 'row', style: 'margin-top:10px;justify-content:space-between' }, $e('small', { class: 'muted', text: e.opened ? ago(e.last_activity) : 'נשלח קישור' }),
          $e('div', { class: 'quick', onclick: (ev) => ev.stopPropagation() },
            $e('button', { class: 'btn ghost', title: 'העתקת קישור', icon: 'copy', onclick: () => copy(empUrl(e.token)) }),
            e.phone ? $e('a', { class: 'btn', style: 'background:#e2f6ee;color:#0f9d6a', title: 'שליחה בוואטסאפ', target: '_blank', href: waLink(e), icon: 'chat' }) : null,
            e.status === 'review' ? $e('button', { class: 'btn', style: 'background:var(--ok)', title: 'אשר וקלוט', icon: 'userCheck', onclick: () => hire(e, employeesView) }) : null)))),
      items.length ? null : $e('p', { class: 'muted', style: 'text-align:center;font-size:.85rem;margin:20px 0', text: '—' }));
  }));
  const draw = () => {
    flt.q = q.value; flt.s = fs.value; flt.d = fd.value;
    board.textContent = '';
